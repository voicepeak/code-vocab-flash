<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>代码词汇速刷</title><style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#202c35;background:#f4f7f6}*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid #e5ece9}.top{max-width:1050px;margin:auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:21px;font-weight:800;color:#126b56}.brand small{display:block;font-size:12px;color:#84948e;font-weight:500;margin-top:3px}.top-actions{display:flex;gap:8px}button,.select{border:1px solid #d9e5e0;background:#fff;color:#34463e;border-radius:10px;padding:10px 15px}button:hover{border-color:#48a989}button:disabled{opacity:.45;cursor:default}.active{background:#e3f5ed!important;border-color:#b4dfcc!important;color:#147450!important}main{max-width:1050px;margin:auto;padding:28px 24px 60px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}.stat{background:white;border:1px solid #e4ece8;border-radius:14px;padding:15px 18px;color:#7c8f85;font-size:13px}.stat strong{display:block;color:#203b30;font-size:24px;margin-top:4px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar .spacer{flex:1}.progress{height:6px;background:#dfeae4;border-radius:9px;overflow:hidden;margin-bottom:20px}.progress span{display:block;background:#39ad7b;height:100%;transition:width .2s}.card{background:#fff;border:1px solid #e3ece6;border-radius:24px;box-shadow:0 15px 45px #1c513b0b;min-height:360px;padding:32px;display:flex;flex-direction:column;align-items:center;text-align:center}.eyebrow{font-size:13px;color:#8da198;letter-spacing:.04em}.word{font-size:clamp(36px,6vw,60px);font-weight:750;letter-spacing:-.025em;overflow-wrap:anywhere;margin:38px 0 12px;color:#193e30}.speak{border:0;background:#f1f8f4;padding:8px 12px;color:#23815f}.answer{width:100%;margin:20px auto 0;max-width:760px}.meaning{font-size:23px;font-weight:650;color:#315341;overflow-wrap:anywhere}.examples{color:#83948a;font-size:13px;line-height:1.8;margin-top:16px;overflow-wrap:anywhere}.sources{text-align:left;margin:20px auto 0;max-width:760px}.source{background:#f5f8f6;border:1px solid #e4eee8;border-radius:10px;padding:12px;margin:10px 0;font-size:13px;overflow-wrap:anywhere}.source pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eaf1ed;padding:10px;border-radius:6px;color:#385246;font-size:12px;line-height:1.5}.quality{font-size:12px;color:#a96f36;margin-top:8px}.examples code{color:#5f796b;background:#f3f7f4;padding:2px 5px;border-radius:4px}.reveal{margin-top:26px;border:0;background:#e5f6ed;color:#168055;font-weight:700;padding:13px 30px}.actions{display:flex;gap:12px;justify-content:center;margin-top:20px}.actions button{min-width:120px;font-weight:700;padding:15px}.unknown{background:#fff2e8;border-color:#ffe1c9;color:#ba622a}.known{background:#208b63;border-color:#208b63;color:white}.hint{text-align:center;color:#94a49b;font-size:12px;margin:18px}.notice{margin-top:20px;padding:14px 18px;background:#fff9ec;color:#8a764b;border-radius:12px;font-size:13px;line-height:1.7}.empty{margin:auto;color:#789086}.list{margin-top:22px;background:white;border-radius:16px;padding:20px;border:1px solid #e5ece8}.list h2{font-size:17px;margin:0 0 12px}.list input{width:100%;border:1px solid #dce8e0;border-radius:9px;padding:10px}.rows{max-height:340px;overflow:auto}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #edf2ef}.row div{overflow-wrap:anywhere}.row small{display:block;color:#7c8d83;margin-top:3px}.row button{white-space:nowrap;padding:6px 10px;font-size:12px}@media(max-width:600px){.top{align-items:flex-start}.top-actions{flex-wrap:wrap;justify-content:flex-end}.top-actions button{font-size:12px;padding:8px}.stats{grid-template-columns:repeat(2,1fr)}main{padding:18px 14px}.card{padding:24px 18px;min-height:330px}.actions button{min-width:0;flex:1}.toolbar .spacer{display:none}}
</style></head><body><header><div class="top"><div class="brand">◈ 代码词汇速刷<small>每天认识一点代码里的英语</small></div><div class="top-actions"><button id="export">导出不懂的词</button><button id="reset">重置进度</button></div></div></header><main><div class="stats"><div class="stat">词汇总数<strong id="total"></strong></div><div class="stat">已认识<strong id="knownCount">0</strong></div><div class="stat">不懂 / 待复习<strong id="unknownCount">0</strong></div><div class="stat">尚未判断<strong id="newCount">0</strong></div></div><div class="toolbar"><button data-mode="reviewed">已整理词汇</button><button data-mode="new">未学过</button><button data-mode="unknown">复习不懂</button><button data-mode="all">全部词汇</button><span class="spacer"></span><select id="order" class="select" aria-label="排序"><option value="original">按原文顺序</option><option value="random">随机顺序</option></select><span id="position" class="eyebrow"></span></div><div class="progress"><span id="bar"></span></div><div class="card" id="card"><div class="eyebrow" id="status"></div><div class="word" id="word"></div><button class="speak" id="speak" title="朗读单词">🔊 听发音</button><button class="reveal" id="reveal">显示释义</button><div class="answer" id="answer" hidden><div class="meaning" id="meaning"></div><div class="quality" id="quality"></div><div class="examples" id="examples"></div><div class="sources" id="sources"></div></div><div id="empty" class="empty" hidden></div></div><div class="actions"><button id="previous">← 上一个</button><button id="skip">跳过</button><button id="unknown" class="unknown">不懂 / 待复习</button><button id="known" class="known">认识 ✓</button></div><div class="hint">快捷键：空格显示释义 · ← 不懂 · → 认识 · ↑ 上一个 · ↓ 跳过</div><div class="notice">代码出处来自项目提交 89db38d81af5ce5cd6dfffb8d594cd1e9a6092dd；词义已结合索引中的示例整理；同一词在不同位置可能含义不同，缩写或误拆片段可能仍无法确定。每个词最多展示四处示例，并非全部用法。浏览器会在本机保存学习进度。</div><section class="list"><h2>不懂的词 <span id="listCount"></span></h2><input id="search" placeholder="搜索单词或释义" aria-label="搜索不懂的词"><div class="rows" id="rows"></div></section></main><script src="words.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id), KEY='code-vocab-progress-v2';let state=Object.create(null);try{const raw=JSON.parse(localStorage.getItem(KEY)||'{}');if(raw&&typeof raw==='object'&&!Array.isArray(raw))for(const [word,value] of Object.entries(raw))if(value==='known'||value==='unknown')state[word]=value}catch(e){}let mode='reviewed',order='original',queue=[],index=0,revealed=false;const byWord=new Map(WORDS.map(w=>[w.word,w]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('进度无法保存，请检查浏览器存储设置。')}}function counts(){let known=0,unknown=0;for(const w of WORDS){if(state[w.word]==='known')known++;if(state[w.word]==='unknown')unknown++}return {known,unknown,new:WORDS.length-known-unknown}}function makeQueue(){queue=WORDS.filter(w=>mode==='all'||(mode==='reviewed'?w.reviewed&&!state[w.word]:mode==='new'?!state[w.word]:state[w.word]==='unknown'));if(order==='random'){for(let i=queue.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]]}}index=0;revealed=false;render()}function render(){const c=counts();$('total').textContent=WORDS.length;$('knownCount').textContent=c.known;$('unknownCount').textContent=c.unknown;$('newCount').textContent=c.new;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));let w=queue[index];$('position').textContent=w?`${index+1} / ${queue.length}`:'0 / 0';$('bar').style.width=queue.length?`${(index+1)/queue.length*100}%`:'0%';for(let id of ['status','word','speak','reveal','answer'])$(id).hidden=!w;$('empty').hidden=!!w;$('previous').disabled=!w||index===0;$('known').disabled=$('unknown').disabled=$('skip').disabled=!w;if(w){$('status').textContent=state[w.word]==='known'?'已标记为认识':state[w.word]==='unknown'?'已标记为不懂':'先想一想它的意思';$('word').textContent=w.word;$('reveal').hidden=revealed;$('answer').hidden=!revealed;$('meaning').textContent=w.meaning;$('quality').textContent=w.quality;let sources=$('sources');sources.replaceChildren();for(const src of w.sources||[]){let box=document.createElement('div');box.className='source';let title=document.createElement('strong');title.textContent=src.identifier+' · '+src.path+':'+src.line;let link=document.createElement('a');link.href='基线源码/'+src.path+'.html#L'+src.line;link.target='_blank';link.rel='noopener';link.textContent='查看完整文件 ↗';link.style.cssText='display:block;margin-top:8px;color:#168055';let pre=document.createElement('pre');pre.textContent=src.snippet;box.append(title,link,pre);sources.append(box)}let ex=$('examples');ex.replaceChildren();if(w.examples.length){ex.append('代码中的例子： ');w.examples.forEach((s,i)=>{if(i)ex.append('  ');let code=document.createElement('code');code.textContent=s;ex.append(code)})}}else $('empty').textContent=mode==='reviewed'?'已整理的词已经刷完了！可以去复习不懂的词。':mode==='new'?'未学过的词已经刷完了！可以去复习不懂的词。':mode==='unknown'?'还没有不懂的词，继续加油！':'没有词汇。';renderList()}
function renderList(){let list=WORDS.filter(w=>state[w.word]==='unknown'),q=$('search').value.trim().toLowerCase();$('listCount').textContent=`（${list.length}）`;list=list.filter(w=>w.word.toLowerCase().includes(q)||w.meaning.toLowerCase().includes(q));let rows=$('rows');rows.replaceChildren();if(!list.length){let p=document.createElement('p');p.className='eyebrow';p.textContent=q?'没有找到匹配的词。':'标记不懂的词会显示在这里。';rows.append(p);return}list.forEach(w=>{let row=document.createElement('div');row.className='row';let info=document.createElement('div'),strong=document.createElement('strong'),small=document.createElement('small'),button=document.createElement('button');strong.textContent=w.word;small.textContent=w.meaning;info.append(strong,small);button.textContent='标为认识';button.onclick=()=>{state[w.word]='known';save();if(mode==='unknown')makeQueue();else render()};row.append(info,button);rows.append(row)})}
function mark(value){let w=queue[index];if(!w)return;state[w.word]=value;save();if(index<queue.length-1){index++;revealed=false;render()}else{makeQueue()}}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;makeQueue()});$('order').onchange=e=>{order=e.target.value;makeQueue()};$('reveal').onclick=()=>{revealed=true;render()};$('previous').onclick=()=>{if(index>0){index--;revealed=false;render()}};$('known').onclick=()=>mark('known');$('unknown').onclick=()=>mark('unknown');$('skip').onclick=()=>{if(!queue[index])return;if(index<queue.length-1){index++;revealed=false;render()}else makeQueue()};$('search').oninput=renderList;$('speak').onclick=()=>{if(!queue[index]||!('speechSynthesis'in window))return;let u=new SpeechSynthesisUtterance(queue[index].word);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)};$('export').onclick=()=>{let list=WORDS.filter(w=>state[w.word]==='unknown');if(!list.length){alert('还没有标记不懂的词。');return}let content='# 不懂的代码词汇\n\n共 '+list.length+' 个词\n\n代码基线：89db38d81af5ce5cd6dfffb8d594cd1e9a6092dd。示例并非所有用法，具体含义请结合代码判断。\n\n| 单词 | 释义 | 代码示例 |\n|---|---|---|\n'+list.map(w=>`| ${w.word.replaceAll('|','\\|')} | ${w.meaning.replaceAll('|','\\|')} | ${(w.sources||[]).map(s=>s.identifier+' ('+s.path+':'+s.line+')').join('；').replaceAll('|','\\|')} |`).join('\n')+'\n';let url=URL.createObjectURL(new Blob([content],{type:'text/markdown;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='不懂的代码词汇.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('reset').onclick=()=>{if(confirm('确定清空所有认识和不懂的标记吗？此操作无法撤销。')){state=Object.create(null);save();makeQueue()}};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.code==='Space'||e.key===' '){e.preventDefault();if(queue[index]){revealed=!revealed;render()}}else if(e.key==='ArrowLeft'){e.preventDefault();mark('unknown')}else if(e.key==='ArrowRight'){e.preventDefault();mark('known')}else if(e.key==='ArrowUp'){e.preventDefault();$('previous').click()}else if(e.key==='ArrowDown'){e.preventDefault();$('skip').click()}});makeQueue()})();
</script></body></html>
